{% extends "base.html" %}

{% block content %}
<section class="page-banner py-5 text-center">
    <div class="container py-4">
        <h1 class="display-3 fw-bold mb-3"><span style="color: var(--color-accent, #f59e0b);">404</span> - Page Not Found</h1>
        <p class="lead text-muted mx-auto" style="max-width: 600px;">
            The page or engineering resource you are looking for might have been moved, renamed, or is temporarily unavailable.
        </p>
        <div class="mt-4 d-flex justify-content-center gap-3">
            <a href="/" class="btn btn-warning fw-bold px-4 py-2">
                <i class="fa-solid fa-house me-2"></i> Return Home
            </a>
            <a href="/products" class="btn btn-outline-light fw-bold px-4 py-2">
                <i class="fa-solid fa-industry me-2"></i> Browse Products
            </a>
            <a href="/contact" class="btn btn-outline-warning fw-bold px-4 py-2">
                <i class="fa-solid fa-envelope me-2"></i> Contact Us
            </a>
        </div>
    </div>
</section>
{% endblock %}
