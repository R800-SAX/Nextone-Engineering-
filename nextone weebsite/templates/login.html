<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | NextOne Engineering</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --color-bg: #0a0f1d;
            --color-card-bg: rgba(17, 24, 39, 0.7);
            --color-accent: #f59e0b;
            --color-accent-hover: #d97706;
            --color-border: rgba(255, 255, 255, 0.08);
            --color-text: #ffffff;
            --color-text-muted: #94a3b8;
        }

        body {
            background: radial-gradient(circle at top right, #111827 0%, var(--color-bg) 100%);
            color: var(--color-text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            background: var(--color-card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-logo {
            font-size: 32px;
            color: var(--color-accent);
            margin-bottom: 12px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--color-text-muted);
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-text-muted);
            margin-bottom: 8px;
        }

        .input-group {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .input-group-text {
            background: transparent;
            border: none;
            color: var(--color-text-muted);
            padding-left: 18px;
        }

        .form-control {
            background: transparent;
            border: none;
            color: var(--color-text);
            padding: 14px 18px;
            font-size: 15px;
        }

        .form-control:focus {
            background: transparent;
            box-shadow: none;
            color: var(--color-text);
        }

        .btn-login {
            background-color: var(--color-accent);
            border: none;
            color: #000000;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 15px;
        }

        .btn-login:hover {
            background-color: var(--color-accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .back-link a {
            color: var(--color-text-muted);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            color: var(--color-accent);
        }
    </style>
</head>
<body>

    <div class="login-card">
        
        <div class="login-header">
            <div class="login-logo">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="login-title">Admin Dashboard</h1>
            <p class="login-subtitle">Sign in to manage NextOne Inquiries</p>
        </div>

        {% if error %}
        <div class="alert alert-danger border-0 text-center mb-4 py-2" style="background: rgba(220, 38, 38, 0.2); color: #fca5a5; border-radius: 8px; font-size: 14px;">
            <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autocomplete="off">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100">
                Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
            </button>
        </form>

        <div class="back-link">
            <a href="/"><i class="fa-solid fa-arrow-left me-1"></i> Back to Homepage</a>
        </div>

    </div>

</body>
</html>
